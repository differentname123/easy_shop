<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>系统升级维护中 · 智惠</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body {
            background-color: #fafafa;
            background-image: radial-gradient(circle at 50% 30%, #ffffff 0%, #f4f4f5 100%);
            -webkit-font-smoothing: antialiased;
        }
        .num-font {
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-zinc-900 select-none">

<div id="app" class="max-w-md w-full text-center">

    <!-- 顶部状态指示点 -->
    <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-50 border border-amber-200/80 rounded-full text-xs font-semibold text-amber-700 mb-6">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
        <span>AI 算力集群紧急扩容中</span>
    </div>

    <!-- 核心标题：直接体现好用、人多、被挤爆 -->
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-snug mb-3">
        大家实在太会算了！<br>
        <span class="text-zinc-500">AI 服务器已被大家挤爆。</span>
    </h1>

    <!-- 简练文案 -->
    <p class="text-sm text-zinc-600 leading-relaxed font-medium mb-8">
        因近期口碑推荐暴增，算单价并发量远超预期。<br>
        为了让大家继续享受毫秒级精算，工程师正在紧急加配专用 GPU 服务器，很快满血归来！
    </p>

    <!-- 预估恢复时间条 -->
    <div class="bg-white border border-zinc-200/80 rounded-2xl p-4 shadow-sm mb-6 text-xs text-zinc-500 flex items-center justify-between">
        <span class="font-medium">预计恢复倒计时</span>
        <span class="num-font font-bold text-zinc-900 text-sm tracking-wider">
            {{ countdown.hours }}:{{ countdown.minutes }}:{{ countdown.seconds }}
        </span>
    </div>

    <!-- 操作按钮 -->
    <div class="space-y-3">
        <button
            @click="refreshPage"
            class="w-full py-3 bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-white rounded-xl text-sm font-semibold transition-all shadow-sm"
        >
            刷新检测服务
        </button>
        <p class="text-xs text-zinc-400">建议按 <kbd class="px-1.5 py-0.5 bg-zinc-100 border border-zinc-200 rounded font-mono text-zinc-600">Ctrl+D</kbd> 收藏本站备用</p>
    </div>

</div>

<script>
    const { createApp, ref, computed, onMounted, onUnmounted } = Vue

    createApp({
        setup() {
            // 倒计时剩余秒数（默认 1 小时 30 分钟）
            const remaining = ref(90 * 60)
            let timer = null

            const countdown = computed(() => {
                const total = remaining.value
                const hours = String(Math.floor(total / 3600)).padStart(2, '0')
                const minutes = String(Math.floor((total % 3600) / 60)).padStart(2, '0')
                const seconds = String(total % 60).padStart(2, '0')
                return { hours, minutes, seconds }
            })

            const refreshPage = () => {
                window.location.reload()
            }

            onMounted(() => {
                timer = setInterval(() => {
                    if (remaining.value > 0) remaining.value--
                }, 1000)
            })

            onUnmounted(() => {
                if (timer) clearInterval(timer)
            })

            return { countdown, refreshPage }
        }
    }).mount('#app')
</script>
</body>
</html>
