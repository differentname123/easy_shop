# HTTP-only local/staging template. Replace server_name before use.
# Public production MUST add a valid HTTPS vhost/certificate and redirect HTTP
# to HTTPS. Do not serve real login credentials or tokens over plain HTTP.
# This template assumes nginx itself is the public edge. If there is a CDN/load
# balancer, explicitly trust only its real IP ranges before using its headers.
server {
    listen 80;
    server_name shop.example.com;

    client_max_body_size 1m;

    # Proxy the whole site, not just /api: /, /detail, /static and /health
    # belong to the same application. No trailing-path rewrite is required.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace user-supplied forwarding headers; do not append arbitrary XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
